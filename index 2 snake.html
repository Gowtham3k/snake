<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coil — Snake</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap');

  :root{
    --bg: #0b1210;
    --panel: #111c18;
    --grid: #16241f;
    --snake: #7fe0a7;
    --snake-head: #b8ffd4;
    --food: #ff8a5c;
    --ink: #eafff1;
    --dim: #6f8c7d;
  }

  *{ box-sizing: border-box; margin:0; padding:0; }

  body{
    background: var(--bg);
    color: var(--ink);
    font-family: 'Space Grotesk', sans-serif;
    min-height: 100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 24px 16px;
  }

  .wrap{
    width: 100%;
    max-width: 420px;
  }

  .top-row{
    display:flex;
    justify-content: space-between;
    align-items: flex-end;
    margin-bottom: 14px;
  }

  h1{
    font-weight: 700;
    font-size: 26px;
    letter-spacing: -0.02em;
  }

  .scores{
    text-align: right;
    font-family: 'JetBrains Mono', monospace;
  }
  .scores .label{
    font-size: 10px;
    color: var(--dim);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .scores .val{
    font-size: 22px;
    font-weight: 600;
    color: var(--snake);
  }
  .scores .best{
    font-size: 12px;
    color: var(--dim);
    margin-top: 2px;
  }

  .board-wrap{
    position: relative;
    background: var(--panel);
    border-radius: 16px;
    padding: 10px;
    border: 1px solid #1c2c26;
  }

  canvas{
    display:block;
    width: 100%;
    aspect-ratio: 1;
    background: var(--grid);
    border-radius: 10px;
  }

  .overlay{
    position:absolute;
    inset: 10px;
    border-radius: 10px;
    background: rgba(11,18,16,0.88);
    display:flex;
    flex-direction: column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding: 20px;
  }
  .overlay.hidden{ display:none; }

  .overlay h2{
    font-size: 20px;
    margin-bottom: 8px;
  }
  .overlay p{
    color: var(--dim);
    font-size: 13px;
    margin-bottom: 18px;
    max-width: 260px;
    line-height: 1.5;
  }

  .overlay button{
    background: var(--snake);
    color: #0b1210;
    border: none;
    padding: 11px 22px;
    border-radius: 10px;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    font-family: inherit;
  }
  .overlay button:hover{ background: var(--snake-head); }

  .controls{
    display:flex;
    justify-content: center;
    margin-top: 18px;
    gap: 6px;
  }

  .dpad{
    display:grid;
    grid-template-columns: repeat(3, 46px);
    grid-template-rows: repeat(2, 46px);
    gap: 6px;
  }
  .dpad button{
    background: var(--panel);
    border: 1px solid #1c2c26;
    color: var(--ink);
    border-radius: 10px;
    font-size: 16px;
    cursor: pointer;
  }
  .dpad button:active{ background: var(--grid); }
  #btnUp{ grid-column: 2; grid-row: 1; }
  #btnLeft{ grid-column: 1; grid-row: 2; }
  #btnDown{ grid-column: 2; grid-row: 2; }
  #btnRight{ grid-column: 3; grid-row: 2; }

  .hint{
    text-align:center;
    color: var(--dim);
    font-size: 12px;
    margin-top: 14px;
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="top-row">
    <h1>Coil</h1>
    <div class="scores">
      <div class="label">Score</div>
      <div class="val" id="score">0</div>
      <div class="best" id="best">Best: 0</div>
    </div>
  </div>

  <div class="board-wrap">
    <canvas id="board" width="400" height="400"></canvas>

    <div class="overlay" id="startOverlay">
      <h2>Ready to play?</h2>
      <p>Use arrow keys or swipe to move. Eat the dots, don't hit yourself or the wall.</p>
      <button id="startBtn">Start game</button>
    </div>

    <div class="overlay hidden" id="overOverlay">
      <h2 id="overTitle">Game over</h2>
      <p id="overScore">You scored 0</p>
      <button id="restartBtn">Play again</button>
    </div>
  </div>

  <div class="controls">
    <div class="dpad">
      <button id="btnUp">↑</button>
      <button id="btnLeft">←</button>
      <button id="btnDown">↓</button>
      <button id="btnRight">→</button>
    </div>
  </div>

  <div class="hint">Arrow keys / WASD on desktop, tap pad on mobile</div>
</div>

<script>
  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  const GRID_SIZE = 20;
  const CELL = canvas.width / GRID_SIZE;

  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const startOverlay = document.getElementById('startOverlay');
  const overOverlay = document.getElementById('overOverlay');
  const overScore = document.getElementById('overScore');
  const startBtn = document.getElementById('startBtn');
  const restartBtn = document.getElementById('restartBtn');

  const BEST_KEY = 'coil-best-score';
  let best = Number(localStorage.getItem(BEST_KEY) || 0);
  bestEl.textContent = `Best: ${best}`;

  let snake, direction, nextDirection, food, score, gameLoop, speed, running;

  function resetState(){
    snake = [
      { x: 9, y: 10 },
      { x: 8, y: 10 },
      { x: 7, y: 10 }
    ];
    direction = 'right';
    nextDirection = 'right';
    score = 0;
    speed = 140;
    running = false;
    scoreEl.textContent = '0';
    placeFood();
  }

  function placeFood(){
    let valid = false;
    while (!valid){
      food = {
        x: Math.floor(Math.random() * GRID_SIZE),
        y: Math.floor(Math.random() * GRID_SIZE)
      };
      valid = !snake.some(s => s.x === food.x && s.y === food.y);
    }
  }

  function draw(){
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // food
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--food');
    const fx = food.x * CELL, fy = food.y * CELL;
    ctx.beginPath();
    ctx.arc(fx + CELL/2, fy + CELL/2, CELL/2.6, 0, Math.PI*2);
    ctx.fill();

    // snake
    snake.forEach((seg, i) => {
      ctx.fillStyle = i === 0
        ? getComputedStyle(document.documentElement).getPropertyValue('--snake-head')
        : getComputedStyle(document.documentElement).getPropertyValue('--snake');
      const x = seg.x * CELL, y = seg.y * CELL;
      const r = 5;
      ctx.beginPath();
      ctx.roundRect(x + 1, y + 1, CELL - 2, CELL - 2, r);
      ctx.fill();
    });
  }

  function step(){
    direction = nextDirection;
    const head = { ...snake[0] };

    if (direction === 'up') head.y -= 1;
    if (direction === 'down') head.y += 1;
    if (direction === 'left') head.x -= 1;
    if (direction === 'right') head.x += 1;

    // wall collision
    if (head.x < 0 || head.x >= GRID_SIZE || head.y < 0 || head.y >= GRID_SIZE){
      return endGame();
    }
    // self collision
    if (snake.some(s => s.x === head.x && s.y === head.y)){
      return endGame();
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y){
      score += 10;
      scoreEl.textContent = score;
      placeFood();
      if (speed > 60) {
        speed -= 3;
        restartLoop();
      }
    } else {
      snake.pop();
    }

    draw();
  }

  function restartLoop(){
    clearInterval(gameLoop);
    gameLoop = setInterval(step, speed);
  }

  function endGame(){
    running = false;
    clearInterval(gameLoop);
    if (score > best){
      best = score;
      localStorage.setItem(BEST_KEY, best);
      bestEl.textContent = `Best: ${best}`;
    }
    document.getElementById('overTitle').textContent =
      score > 0 && score === best ? 'New best!' : 'Game over';
    overScore.textContent = `You scored ${score}`;
    overOverlay.classList.remove('hidden');
  }

  function startGame(){
    resetState();
    running = true;
    startOverlay.classList.add('hidden');
    overOverlay.classList.add('hidden');
    draw();
    restartLoop();
  }

  function setDirection(dir){
    const opposite = { up: 'down', down: 'up', left: 'right', right: 'left' };
    if (!running) return;
    if (opposite[dir] === direction) return;
    nextDirection = dir;
  }

  document.addEventListener('keydown', (e) => {
    const map = {
      ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
      w: 'up', s: 'down', a: 'left', d: 'right'
    };
    if (map[e.key]){
      e.preventDefault();
      setDirection(map[e.key]);
    }
  });

  document.getElementById('btnUp').addEventListener('click', () => setDirection('up'));
  document.getElementById('btnDown').addEventListener('click', () => setDirection('down'));
  document.getElementById('btnLeft').addEventListener('click', () => setDirection('left'));
  document.getElementById('btnRight').addEventListener('click', () => setDirection('right'));

  // swipe controls
  let touchStartX = 0, touchStartY = 0;
  canvas.addEventListener('touchstart', (e) => {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  });
  canvas.addEventListener('touchend', (e) => {
    const dx = e.changedTouches[0].clientX - touchStartX;
    const dy = e.changedTouches[0].clientY - touchStartY;
    if (Math.abs(dx) > Math.abs(dy)){
      setDirection(dx > 0 ? 'right' : 'left');
    } else {
      setDirection(dy > 0 ? 'down' : 'up');
    }
  });

  startBtn.addEventListener('click', startGame);
  restartBtn.addEventListener('click', startGame);

  resetState();
  draw();
</script>

</body>
</html>
